name: Publish to WordPress.org
run-name: Publish VST ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }} to WordPress.org

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Published GitHub Release version (x.y.z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wordpress-org-publish
  cancel-in-progress: false

env:
  WPORG_SLUG: yoohw-vietnam-store-tools
  RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

jobs:
  validate-package:
    name: Validate WordPress.org package
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      payload_sha256: ${{ steps.payload.outputs.sha256 }}
    steps:
      - name: Checkout published release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$RELEASE_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be semantic x.y.z, got: $VERSION" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq '[.draft, .prerelease] | @tsv')"
            if [[ "$RELEASE_STATE" != $'false\tfalse' ]]; then
              echo "Manual publish requires an existing published, non-prerelease GitHub Release for $VERSION." >&2
              echo "release_state=$RELEASE_STATE" >&2
              exit 1
            fi
          fi

          RELEASE_BRANCH="release/$VERSION"
          git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"

          TAG_SHA="$(git rev-parse HEAD)"
          RELEASE_SHA="$(git rev-parse "origin/$RELEASE_BRANCH")"
          if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "Tag $VERSION must point exactly at $RELEASE_BRANCH head." >&2
            echo "tag=$TAG_SHA release=$RELEASE_SHA" >&2
            exit 1
          fi

          PLUGIN_VERSION="$(awk -F': ' '/^[[:space:]]*\*[[:space:]]Version:/ {print $2; exit}' yoohw-vietnam-store-tools.php)"
          STABLE_TAG="$(awk -F': ' '/^Stable tag:/ {print $2; exit}' readme.txt)"
          CHANGELOG_VERSION="$(sed -nE 's/^= ([0-9]+(\.[0-9]+)+) \(.*/\1/p' changelog.txt | head -n 1)"
          CONTRACT_STABLE="$(sed -nE 's/^PUBLISHED_STABLE_VERSION = "([^"]+)"/\1/p' tests/repository-contract-tests.py)"

          for VALUE in "$PLUGIN_VERSION" "$STABLE_TAG" "$CHANGELOG_VERSION" "$CONTRACT_STABLE"; do
            if [[ "$VALUE" != "$VERSION" ]]; then
              echo "Release metadata is not synchronized with tag $VERSION." >&2
              echo "plugin=$PLUGIN_VERSION stable=$STABLE_TAG changelog=$CHANGELOG_VERSION contract=$CONTRACT_STABLE" >&2
              exit 1
            fi
          done

          python3 tests/repository-contract-tests.py

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Stage and validate reviewed WordPress.org payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wporg-dist
          mkdir wporg-dist

          for path in \
            assets \
            blocks \
            data \
            includes \
            languages \
            templates \
            index.php \
            yoohw-vietnam-store-tools.php \
            readme.txt \
            changelog.txt \
            changelog-vi.txt
          do
            if [[ ! -e "$path" ]]; then
              echo "Required distribution path is missing: $path" >&2
              exit 1
            fi
            cp -a "$path" wporg-dist/
          done

          find wporg-dist -name '*.php' -print0 | xargs -0 -n1 php -l

          printf '%s\n' \
            assets \
            blocks \
            changelog-vi.txt \
            changelog.txt \
            data \
            includes \
            index.php \
            languages \
            readme.txt \
            templates \
            yoohw-vietnam-store-tools.php | sort > "$RUNNER_TEMP/expected-top-level.txt"

          find wporg-dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$RUNNER_TEMP/actual-top-level.txt"
          diff -u "$RUNNER_TEMP/expected-top-level.txt" "$RUNNER_TEMP/actual-top-level.txt"

          if find wporg-dist \
            \( -name '.git' -o -name '.github' -o -name 'AGENTS.md' -o -name 'tests' -o -name '.DS_Store' -o -name '*.zip' \) \
            -print -quit | grep -q .; then
            echo "WordPress.org payload contains a forbidden development artifact." >&2
            exit 1
          fi

          if find wporg-dist -type l -print -quit | grep -q .; then
            echo "WordPress.org payload contains a symbolic link." >&2
            exit 1
          fi

          (
            cd wporg-dist
            while IFS= read -r -d '' file; do
              FILE_SHA="$(sha256sum "$file" | awk '{print $1}')"
              printf '%s  %s\n' "$FILE_SHA" "${file#./}"
            done < <(find . -type f -print0 | sort -z)
          ) > "$RUNNER_TEMP/wporg-payload.manifest"

          PAYLOAD_SHA256="$(sha256sum "$RUNNER_TEMP/wporg-payload.manifest" | awk '{print $1}')"
          echo "sha256=$PAYLOAD_SHA256" >> "$GITHUB_OUTPUT"
          echo "Validated payload manifest SHA-256: $PAYLOAD_SHA256"

      - name: Build exact WordPress.org ZIP without SVN credentials
        id: package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="$RUNNER_TEMP/wporg-package-root"
          INSPECT_ROOT="$RUNNER_TEMP/wporg-package-inspect"
          ZIP_PATH="$GITHUB_WORKSPACE/${WPORG_SLUG}.zip"

          rm -rf "$PACKAGE_ROOT" "$INSPECT_ROOT" "$ZIP_PATH"
          mkdir -p "$PACKAGE_ROOT/$WPORG_SLUG" "$INSPECT_ROOT"
          cp -a wporg-dist/. "$PACKAGE_ROOT/$WPORG_SLUG/"

          (
            cd "$PACKAGE_ROOT"
            zip -qr "$ZIP_PATH" "$WPORG_SLUG"
          )

          unzip -q "$ZIP_PATH" -d "$INSPECT_ROOT"
          diff -qr wporg-dist "$INSPECT_ROOT/$WPORG_SLUG"

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Run WordPress Plugin Check on generated package
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: wporg-dist
          slug: ${{ env.WPORG_SLUG }}

      - name: Upload exact WordPress.org ZIP for Human inspection
        if: ${{ always() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.zip_path }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to WordPress.org
    needs:
      - validate-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: wordpress.org
      url: https://wordpress.org/plugins/yoohw-vietnam-store-tools/
    steps:
      - name: Checkout approved release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-verify approved release source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          RELEASE_BRANCH="release/$VERSION"
          git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "origin/$RELEASE_BRANCH")" ]]
          [[ "$(awk -F': ' '/^Stable tag:/ {print $2; exit}' readme.txt)" == "$VERSION" ]]

      - name: Re-stage approved WordPress.org payload
        shell: bash
        env:
          EXPECTED_PAYLOAD_SHA256: ${{ needs.validate-package.outputs.payload_sha256 }}
        run: |
          set -euo pipefail
          rm -rf wporg-dist
          mkdir wporg-dist

          for path in \
            assets \
            blocks \
            data \
            includes \
            languages \
            templates \
            index.php \
            yoohw-vietnam-store-tools.php \
            readme.txt \
            changelog.txt \
            changelog-vi.txt
          do
            test -e "$path"
            cp -a "$path" wporg-dist/
          done

          (
            cd wporg-dist
            while IFS= read -r -d '' file; do
              FILE_SHA="$(sha256sum "$file" | awk '{print $1}')"
              printf '%s  %s\n' "$FILE_SHA" "${file#./}"
            done < <(find . -type f -print0 | sort -z)
          ) > "$RUNNER_TEMP/wporg-payload.manifest"

          ACTUAL_PAYLOAD_SHA256="$(sha256sum "$RUNNER_TEMP/wporg-payload.manifest" | awk '{print $1}')"
          if [[ -z "$EXPECTED_PAYLOAD_SHA256" || "$ACTUAL_PAYLOAD_SHA256" != "$EXPECTED_PAYLOAD_SHA256" ]]; then
            echo "Deploy payload does not match the payload validated before Environment approval." >&2
            echo "expected=$EXPECTED_PAYLOAD_SHA256 actual=$ACTUAL_PAYLOAD_SHA256" >&2
            exit 1
          fi

          echo "Approved payload manifest SHA-256 matches: $ACTUAL_PAYLOAD_SHA256"

      - name: Deploy approved release to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        env:
          SLUG: ${{ env.WPORG_SLUG }}
          VERSION: ${{ env.RELEASE_VERSION }}
          BUILD_DIR: wporg-dist
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Verify WordPress.org SVN tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          svn ls "https://plugins.svn.wordpress.org/${WPORG_SLUG}/tags/${VERSION}/" >/dev/null
          {
            echo "### WordPress.org SVN deployment complete"
            echo
            echo "- Plugin: ${WPORG_SLUG}"
            echo "- Version: ${VERSION}"
            echo "- SVN tag exists: yes"
            echo
            echo "If WordPress.org Release Confirmation is enabled, the release still requires confirmation in WordPress.org before it is issued to users."
          } >> "$GITHUB_STEP_SUMMARY"

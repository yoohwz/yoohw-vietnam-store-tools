name: VST CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: CI change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      run_php: ${{ steps.classify.outputs.run_php }}
      run_localization_quality: ${{ steps.classify.outputs.run_localization_quality }}
      run_localization_runtime: ${{ steps.classify.outputs.run_localization_runtime }}
      run_plugin_check: ${{ steps.classify.outputs.run_plugin_check }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          set -euo pipefail
          changed_files=()

          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff --name-only "${PR_BASE_SHA}...HEAD")
          fi

          python3 scripts/ci_classify.py \
            --event-name "$EVENT_NAME" \
            --pr-draft "$PR_DRAFT" \
            "${changed_files[@]}" >> "$GITHUB_OUTPUT"

  repository-contracts:
    name: Repository contracts
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Changed PHP syntax
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            range="${PR_BASE_SHA}...HEAD"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            range="${PUSH_BEFORE}...HEAD"
          else
            range="HEAD^..HEAD"
          fi

          while IFS= read -r file; do
            if [[ "$file" == *.php && -f "$file" ]]; then
              php -l "$file"
            fi
          done < <(git diff --name-only --diff-filter=ACMR "$range")

      - name: Email placeholder contracts
        run: php tests/email-placeholder-contract-tests.php

      - name: Address contracts
        run: php tests/address-contract-tests.php

      - name: Audit hardening contracts
        run: php tests/audit-hardening-contract-tests.php

      - name: Architecture foundation contracts
        run: php tests/architecture-contract-tests.php

      - name: CI workflow contracts
        run: python3 tests/ci-workflow-contract-tests.py

      - name: Repository metadata contracts
        run: python3 tests/repository-contract-tests.py

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --version
          find . -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi

  php-syntax-74:
    name: PHP 7.4 syntax
    needs:
      - changes
      - repository-contracts
    if: ${{ needs.changes.outputs.run_php == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '7.4'
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  php-syntax-82:
    name: PHP 8.2 syntax
    needs:
      - changes
      - repository-contracts
    if: ${{ needs.changes.outputs.run_php == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  php-syntax-84:
    name: PHP 8.4 syntax
    needs:
      - changes
      - repository-contracts
    if: ${{ needs.changes.outputs.run_php == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  localization-quality:
    name: Localization quality
    needs:
      - changes
      - repository-contracts
    if: ${{ needs.changes.outputs.run_localization_quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install pinned localization tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext
          curl -fsSL https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o "$RUNNER_TEMP/wp"
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $RUNNER_TEMP/wp" | sha256sum --check
          chmod +x "$RUNNER_TEMP/wp"
      - name: Validate localization sources and compiled catalogs
        env:
          WP_CLI_BIN: ${{ runner.temp }}/wp
        run: scripts/localization-quality.sh check

  localization-runtime-63:
    name: WordPress 6.3 translation runtime
    needs:
      - changes
      - repository-contracts
    if: ${{ needs.changes.outputs.run_localization_runtime == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Prepare runtime fixture and wp-env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext
          msgfmt --check --check-format tests/fixtures/vst-language-pack-sentinel.po -o tests/fixtures/.runtime-sentinel.mo
          cat > .wp-env.json <<'JSON'
          {
            "core": "WordPress/WordPress#6.3",
            "mappings": {
              "wp-content/plugins/yoohw-vietnam-store-tools": "."
            },
            "config": {
              "WP_DEBUG": true,
              "WP_DEBUG_LOG": true,
              "WP_DEBUG_DISPLAY": true
            }
          }
          JSON
          npx --yes @wordpress/env@11.13.0 start --update
      - name: Verify bundled fallback and language-pack priority
        shell: bash
        run: |
          set -euo pipefail
          wp_env=(npx --yes @wordpress/env@11.13.0)
          "${wp_env[@]}" run cli wp eval 'wp_mkdir_p( WP_PLUGIN_DIR . "/woocommerce" ); file_put_contents( WP_PLUGIN_DIR . "/woocommerce/woocommerce.php", "<?php\n/**\n * Plugin Name: WooCommerce runtime dependency stub\n * Version: 1.0.0\n */\n" );'
          "${wp_env[@]}" run cli wp plugin activate woocommerce
          "${wp_env[@]}" run cli wp eval 'wp_mkdir_p( WPMU_PLUGIN_DIR ); wp_mkdir_p( WP_LANG_DIR ); copy( WP_PLUGIN_DIR . "/yoohw-vietnam-store-tools/tests/fixtures/vst-translation-monitor.php", WPMU_PLUGIN_DIR . "/vst-translation-monitor.php" ); copy( WP_PLUGIN_DIR . "/yoohw-vietnam-store-tools/tests/fixtures/.runtime-sentinel.mo", WP_LANG_DIR . "/vi.mo" );'
          "${wp_env[@]}" run cli wp option update WPLANG vi
          "${wp_env[@]}" run cli wp plugin activate yoohw-vietnam-store-tools 2>&1 | tee "$RUNNER_TEMP/vst-activation.log"
          ! grep -F '_load_textdomain_just_in_time' "$RUNNER_TEMP/vst-activation.log"
          "${wp_env[@]}" run cli wp eval-file wp-content/plugins/yoohw-vietnam-store-tools/tests/runtime-localization-smoke.php 'Thêm quy tắc'
          "${wp_env[@]}" run cli wp eval 'wp_mkdir_p( WP_LANG_DIR . "/plugins" ); copy( YOOHW_VIETNAM_STORE_TOOLS_PLUGIN_DIR . "tests/fixtures/.runtime-sentinel.mo", WP_LANG_DIR . "/plugins/yoohw-vietnam-store-tools-vi.mo" );'
          "${wp_env[@]}" run cli wp eval-file wp-content/plugins/yoohw-vietnam-store-tools/tests/runtime-localization-smoke.php LANGPACK_SENTINEL
      - name: Stop wp-env
        if: ${{ always() }}
        run: npx --yes @wordpress/env@11.13.0 stop

  localization-runtime-67:
    name: WordPress 6.7 translation runtime
    needs:
      - changes
      - repository-contracts
    if: ${{ needs.changes.outputs.run_localization_runtime == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Prepare runtime fixture and wp-env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext
          msgfmt --check --check-format tests/fixtures/vst-language-pack-sentinel.po -o tests/fixtures/.runtime-sentinel.mo
          cat > .wp-env.json <<'JSON'
          {
            "core": "WordPress/WordPress#6.7",
            "mappings": {
              "wp-content/plugins/yoohw-vietnam-store-tools": "."
            },
            "config": {
              "WP_DEBUG": true,
              "WP_DEBUG_LOG": true,
              "WP_DEBUG_DISPLAY": true
            }
          }
          JSON
          npx --yes @wordpress/env@11.13.0 start --update
      - name: Verify bundled fallback and language-pack priority
        shell: bash
        run: |
          set -euo pipefail
          wp_env=(npx --yes @wordpress/env@11.13.0)
          "${wp_env[@]}" run cli wp eval 'wp_mkdir_p( WP_PLUGIN_DIR . "/woocommerce" ); file_put_contents( WP_PLUGIN_DIR . "/woocommerce/woocommerce.php", "<?php\n/**\n * Plugin Name: WooCommerce runtime dependency stub\n * Version: 1.0.0\n */\n" );'
          "${wp_env[@]}" run cli wp plugin activate woocommerce
          "${wp_env[@]}" run cli wp eval 'wp_mkdir_p( WPMU_PLUGIN_DIR ); wp_mkdir_p( WP_LANG_DIR ); copy( WP_PLUGIN_DIR . "/yoohw-vietnam-store-tools/tests/fixtures/vst-translation-monitor.php", WPMU_PLUGIN_DIR . "/vst-translation-monitor.php" ); copy( WP_PLUGIN_DIR . "/yoohw-vietnam-store-tools/tests/fixtures/.runtime-sentinel.mo", WP_LANG_DIR . "/vi.mo" );'
          "${wp_env[@]}" run cli wp option update WPLANG vi
          "${wp_env[@]}" run cli wp plugin activate yoohw-vietnam-store-tools 2>&1 | tee "$RUNNER_TEMP/vst-activation.log"
          ! grep -F '_load_textdomain_just_in_time' "$RUNNER_TEMP/vst-activation.log"
          "${wp_env[@]}" run cli wp eval-file wp-content/plugins/yoohw-vietnam-store-tools/tests/runtime-localization-smoke.php 'Thêm quy tắc'
          "${wp_env[@]}" run cli wp eval 'wp_mkdir_p( WP_LANG_DIR . "/plugins" ); copy( YOOHW_VIETNAM_STORE_TOOLS_PLUGIN_DIR . "tests/fixtures/.runtime-sentinel.mo", WP_LANG_DIR . "/plugins/yoohw-vietnam-store-tools-vi.mo" );'
          "${wp_env[@]}" run cli wp eval-file wp-content/plugins/yoohw-vietnam-store-tools/tests/runtime-localization-smoke.php LANGPACK_SENTINEL
      - name: Stop wp-env
        if: ${{ always() }}
        run: npx --yes @wordpress/env@11.13.0 stop

  localization-runtime-latest:
    name: WordPress latest translation runtime
    needs:
      - changes
      - repository-contracts
    if: ${{ needs.changes.outputs.run_localization_runtime == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Prepare runtime fixture and wp-env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext
          msgfmt --check --check-format tests/fixtures/vst-language-pack-sentinel.po -o tests/fixtures/.runtime-sentinel.mo
          cat > .wp-env.json <<'JSON'
          {
            "core": null,
            "mappings": {
              "wp-content/plugins/yoohw-vietnam-store-tools": "."
            },
            "config": {
              "WP_DEBUG": true,
              "WP_DEBUG_LOG": true,
              "WP_DEBUG_DISPLAY": true
            }
          }
          JSON
          npx --yes @wordpress/env@11.13.0 start --update
      - name: Verify bundled fallback and language-pack priority
        shell: bash
        run: |
          set -euo pipefail
          wp_env=(npx --yes @wordpress/env@11.13.0)
          "${wp_env[@]}" run cli wp eval 'wp_mkdir_p( WP_PLUGIN_DIR . "/woocommerce" ); file_put_contents( WP_PLUGIN_DIR . "/woocommerce/woocommerce.php", "<?php\n/**\n * Plugin Name: WooCommerce runtime dependency stub\n * Version: 1.0.0\n */\n" );'
          "${wp_env[@]}" run cli wp plugin activate woocommerce
          "${wp_env[@]}" run cli wp eval 'wp_mkdir_p( WPMU_PLUGIN_DIR ); wp_mkdir_p( WP_LANG_DIR ); copy( WP_PLUGIN_DIR . "/yoohw-vietnam-store-tools/tests/fixtures/vst-translation-monitor.php", WPMU_PLUGIN_DIR . "/vst-translation-monitor.php" ); copy( WP_PLUGIN_DIR . "/yoohw-vietnam-store-tools/tests/fixtures/.runtime-sentinel.mo", WP_LANG_DIR . "/vi.mo" );'
          "${wp_env[@]}" run cli wp option update WPLANG vi
          "${wp_env[@]}" run cli wp plugin activate yoohw-vietnam-store-tools 2>&1 | tee "$RUNNER_TEMP/vst-activation.log"
          ! grep -F '_load_textdomain_just_in_time' "$RUNNER_TEMP/vst-activation.log"
          "${wp_env[@]}" run cli wp eval-file wp-content/plugins/yoohw-vietnam-store-tools/tests/runtime-localization-smoke.php 'Thêm quy tắc'
          "${wp_env[@]}" run cli wp eval 'wp_mkdir_p( WP_LANG_DIR . "/plugins" ); copy( YOOHW_VIETNAM_STORE_TOOLS_PLUGIN_DIR . "tests/fixtures/.runtime-sentinel.mo", WP_LANG_DIR . "/plugins/yoohw-vietnam-store-tools-vi.mo" );'
          "${wp_env[@]}" run cli wp eval-file wp-content/plugins/yoohw-vietnam-store-tools/tests/runtime-localization-smoke.php LANGPACK_SENTINEL
      - name: Stop wp-env
        if: ${{ always() }}
        run: npx --yes @wordpress/env@11.13.0 stop

  plugin-check:
    name: WordPress Plugin Check
    needs:
      - changes
      - repository-contracts
    if: ${{ needs.changes.outputs.run_plugin_check == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Stage reviewed WordPress.org payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wporg-dist
          mkdir wporg-dist
          for path in \
            assets \
            blocks \
            data \
            includes \
            languages \
            templates \
            index.php \
            yoohw-vietnam-store-tools.php \
            readme.txt \
            changelog.txt \
            changelog-vi.txt
          do
            test -e "$path"
            cp -a "$path" wporg-dist/
          done
      - name: Prepare strict Plugin Check validation payload
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_VERSION="$(awk -F': ' '/^[[:space:]]*\*[[:space:]]Version:/ {print $2; exit}' wporg-dist/yoohw-vietnam-store-tools.php)"
          STABLE_TAG="$(awk -F': ' '/^Stable tag:/ {print $2; exit}' wporg-dist/readme.txt)"
          PUBLISHED_STABLE_VERSION="$(sed -nE 's/^PUBLISHED_STABLE_VERSION = "([^"]+)"/\1/p' tests/repository-contract-tests.py)"
          test -n "$PLUGIN_VERSION"
          test -n "$STABLE_TAG"
          test -n "$PUBLISHED_STABLE_VERSION"
          test "$STABLE_TAG" = "$PUBLISHED_STABLE_VERSION"
          cp -a wporg-dist plugin-check-dist
          if [[ "$STABLE_TAG" != "$PLUGIN_VERSION" ]]; then
            sed -i -E "s/^Stable tag: .+$/Stable tag: ${PLUGIN_VERSION}/" plugin-check-dist/readme.txt
          fi
          test "$(awk -F': ' '/^Stable tag:/ {print $2; exit}' plugin-check-dist/readme.txt)" = "$PLUGIN_VERSION"
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: plugin-check-dist
          slug: yoohw-vietnam-store-tools
          strict: true

  required-gate:
    name: VST Required Gate
    needs:
      - changes
      - repository-contracts
      - php-syntax-74
      - php-syntax-82
      - php-syntax-84
      - localization-quality
      - localization-runtime-63
      - localization-runtime-67
      - localization-runtime-latest
      - plugin-check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI results
        shell: bash
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUICK_RESULT: ${{ needs.repository-contracts.result }}
          PHP_EXPECTED: ${{ needs.changes.outputs.run_php }}
          PHP_74_RESULT: ${{ needs.php-syntax-74.result }}
          PHP_82_RESULT: ${{ needs.php-syntax-82.result }}
          PHP_84_RESULT: ${{ needs.php-syntax-84.result }}
          LOCALIZATION_QUALITY_EXPECTED: ${{ needs.changes.outputs.run_localization_quality }}
          LOCALIZATION_QUALITY_RESULT: ${{ needs.localization-quality.result }}
          LOCALIZATION_RUNTIME_EXPECTED: ${{ needs.changes.outputs.run_localization_runtime }}
          LOCALIZATION_RUNTIME_63_RESULT: ${{ needs.localization-runtime-63.result }}
          LOCALIZATION_RUNTIME_67_RESULT: ${{ needs.localization-runtime-67.result }}
          LOCALIZATION_RUNTIME_LATEST_RESULT: ${{ needs.localization-runtime-latest.result }}
          PLUGIN_CHECK_EXPECTED: ${{ needs.changes.outputs.run_plugin_check }}
          PLUGIN_CHECK_RESULT: ${{ needs.plugin-check.result }}
        run: |
          set -euo pipefail
          require_success() {
            local expected="$1"
            local result="$2"
            local label="$3"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "$label failed with result: $result" >&2
              return 1
            fi
            if [[ "$expected" == "true" && "$result" != "success" ]]; then
              echo "$label was required but result was: $result" >&2
              return 1
            fi
            if [[ "$expected" != "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "$label returned unexpected result: $result" >&2
              return 1
            fi
          }
          [[ "$CHANGES_RESULT" == "success" ]] || exit 1
          [[ "$QUICK_RESULT" == "success" ]] || exit 1
          require_success "$PHP_EXPECTED" "$PHP_74_RESULT" "PHP 7.4 syntax"
          require_success "$PHP_EXPECTED" "$PHP_82_RESULT" "PHP 8.2 syntax"
          require_success "$PHP_EXPECTED" "$PHP_84_RESULT" "PHP 8.4 syntax"
          require_success "$LOCALIZATION_QUALITY_EXPECTED" "$LOCALIZATION_QUALITY_RESULT" "Localization quality"
          require_success "$LOCALIZATION_RUNTIME_EXPECTED" "$LOCALIZATION_RUNTIME_63_RESULT" "WordPress 6.3 translation runtime"
          require_success "$LOCALIZATION_RUNTIME_EXPECTED" "$LOCALIZATION_RUNTIME_67_RESULT" "WordPress 6.7 translation runtime"
          require_success "$LOCALIZATION_RUNTIME_EXPECTED" "$LOCALIZATION_RUNTIME_LATEST_RESULT" "WordPress latest translation runtime"
          require_success "$PLUGIN_CHECK_EXPECTED" "$PLUGIN_CHECK_RESULT" "WordPress Plugin Check"
          {
            echo "### VST CI gate"
            echo
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- Repository contracts: $QUICK_RESULT"
            echo "- PHP 7.4 / 8.2 / 8.4: $PHP_74_RESULT / $PHP_82_RESULT / $PHP_84_RESULT"
            echo "- Localization quality: $LOCALIZATION_QUALITY_RESULT"
            echo "- Localization runtime 6.3 / 6.7 / latest: $LOCALIZATION_RUNTIME_63_RESULT / $LOCALIZATION_RUNTIME_67_RESULT / $LOCALIZATION_RUNTIME_LATEST_RESULT"
            echo "- WordPress Plugin Check: $PLUGIN_CHECK_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
